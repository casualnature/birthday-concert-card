<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6ead6"><title>Customize Your Birthday Card</title><style>
:root{--paper:#f8efe2;--ink:#55351f;--gold:#a76c31;--line:#dcc5a7}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:max(28px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));background:radial-gradient(circle at top,#fffaf1,var(--paper));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(100%,620px);margin:auto}header{text-align:center;margin-bottom:24px}.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}h1{margin:8px 0;font-family:Georgia,serif;font-size:clamp(32px,8vw,48px);font-weight:500}header p{margin:0;color:#806951;line-height:1.5}.panel{padding:clamp(20px,5vw,32px);border:1px solid #b98a5540;border-radius:20px;background:#fffdf8;box-shadow:0 20px 60px #6944191c}.field+.field{margin-top:18px}.label-row{display:flex;justify-content:space-between;margin-bottom:7px;font-weight:700}.count{color:#8d765f;font-size:12px;font-weight:400}input,textarea{display:block;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font:inherit;outline:none}textarea{min-height:140px;line-height:1.5;resize:vertical}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b9793330}.preview{margin:24px 0 0;padding:22px;border-radius:14px;background:#fbefd9;text-align:center;font-family:Georgia,serif;line-height:1.5;overflow-wrap:anywhere}.preview p{margin:.4em 0;white-space:pre-wrap}.preview .msg{margin:1em 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button,a.button{display:grid;place-items:center;min-height:46px;padding:10px 16px;border:1px solid var(--gold);border-radius:999px;background:white;color:var(--gold);font:700 14px system-ui;text-decoration:none;cursor:pointer}.primary{background:var(--gold)!important;color:white!important}.result{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}.result[hidden]{display:none}.url{width:100%;min-height:74px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;word-break:break-all;font-size:12px;line-height:1.4}.status{min-height:1.4em;margin:8px 0 0;color:#52734d;font-size:13px}@media(max-width:430px){.actions{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><div class="eyebrow">A little birthday surprise</div><h1>Create your card</h1><p>Add your words, then share the private link. Nothing is uploaded or stored.</p></header><section class="panel"><form id="form"><div class="field"><div class="label-row"><label for="to">To</label><span class="count" id="toCount"></span></div><input id="to" maxlength="40" required value="Emily"></div><div class="field"><div class="label-row"><label for="message">Message</label><span class="count" id="messageCount"></span></div><textarea id="message" maxlength="500" required>Wishing you a wonderful birthday filled with love and happiness.</textarea></div><div class="field"><div class="label-row"><label for="from">From</label><span class="count" id="fromCount"></span></div><input id="from" maxlength="50" required value="Sarah"></div><div class="preview"><p>Dear <span id="pTo"></span>,</p><p class="msg" id="pMessage"></p><p>With love,<br><span id="pFrom"></span></p></div><div class="actions"><button class="primary" type="submit">Generate URL</button><button type="button" id="preview">Open preview</button></div></form><div class="result" id="result" hidden><strong>Your share link</strong><div class="url" id="url" tabindex="0"></div><div class="actions"><button class="primary" id="copy" type="button">Copy URL</button><a class="button" id="open" target="_blank" rel="noopener">Open card</a></div><p class="status" id="status" role="status"></p></div></section></main><script>
const limits={to:40,message:500,from:50},$=id=>document.getElementById(id),fields={to:$("to"),message:$("message"),from:$("from")};
function chars(s){return Array.from(s).length}
function data(){return Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value.trim()]))}
function encoded(){const bytes=new TextEncoder().encode(JSON.stringify(data()));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function cardUrl(){const previewUrl=new URL("../index.html",window.location.href);previewUrl.hash="d="+encoded();return previewUrl}
function update(){const d=data();$("pTo").textContent=d.to||"…";$("pMessage").textContent=d.message||"…";$("pFrom").textContent=d.from||"…";Object.entries(fields).forEach(([k,v])=>$(k+"Count").textContent=`${chars(v.value)} / ${limits[k]}`)}
Object.values(fields).forEach(v=>v.addEventListener("input",update));update();
$("form").addEventListener("submit",e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;const link=cardUrl().href;$("url").textContent=link;$("open").href=link;$("result").hidden=false;$("status").textContent=""});
$("preview").addEventListener("click",()=>{if(!$("form").reportValidity())return;window.open(cardUrl().href,"_blank")});
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("url").textContent);$("status").textContent="URL copied."}catch{$("status").textContent="Select the URL above and copy it manually."}});
</script></body></html>
